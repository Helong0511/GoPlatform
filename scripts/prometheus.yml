global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: ad-platform
    env: production

rule_files:
  - ../monitoring/alerts/prometheus-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9091

  - job_name: ad-platform-main
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          instance: ad-platform-main

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093
